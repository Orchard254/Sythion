[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS desktop shell - spawns the Python sidecar and hosts the dashboard"
authors = ["JARVIS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
ureq = { version = "2.10", default-features = false }

[profile.release]
codegen-units = 1
lto = true
strip = true
