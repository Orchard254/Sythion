[package]
name = "sythion"
version = "0.1.0"
description = "Sythion (Synth) desktop shell - spawns the Python sidecar and hosts the dashboard"
authors = ["Sythion (Synth)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
ureq = { version = "2.10", default-features = false }
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-future = "0.3.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
