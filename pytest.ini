# Sythion (Synth) - pytest configuration.
#
# This file is the single source of truth for the test-selection contract:
# which markers exist, what each marker actually selects, and which tree the
# default (no-argument) invocation collects.
#
# Deliberately NOT set here:
#   * filterwarnings - the suite emits a large number of datetime.utcnow()
#     DeprecationWarnings; they must stay warnings, never errors.
#   * addopts        - no --strict-markers (the guard in
#     backend/tests/conftest.py enforces the same contract mechanically, and
#     an addopts entry would change the effective command line of every
#     invocation).
#   * norecursedirs / python_files / python_classes / xfail_strict.
#
# The marker populations are enforced by the selection-contract guard in
# backend/tests/conftest.py, which aborts a full-tree collection if a marker
# is applied to a set of tests it does not describe.

[pytest]
testpaths = backend/tests
asyncio_mode = strict
markers =
    slow: a slow test (deselect with '-m "not slow"')
    flaky: declared for future use; not currently applied to any test
    integration: declared for future use; not currently applied to any test
    acceptance: the acceptance sub-suite under backend/tests/acceptance/
    gui: requires a live interactive Windows desktop and the real UI Automation stack (currently backend/tests/acceptance/test_gui_fixture.py)
    network: requires an outbound network connection (currently every provider_e2e test)
    process_kill: real Windows process-kill integration tests (run explicitly with SYTHION_RUN_PROCESS_KILL=1)
    provider_e2e: real provider-backed specialist E2E tests (run explicitly with SYTHION_RUN_PROVIDER_E2E=1 plus a configured provider credential/model; skipped otherwise)
    concurrency: tests that exercise the shared runtime under concurrent load
    gated_soak: long-running soak tests, gated behind an explicit environment flag
