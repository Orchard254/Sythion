# Sythion (Synth) - pytest configuration.
#
# This file is the single source of truth for the test-selection contract:
# which markers exist, what each marker actually selects, and which tree the
# default (no-argument) invocation collects. The descriptions below are
# statements about the code as it is today - if one of them stops being true,
# the description is wrong and must be corrected here.
#
# Deliberately NOT set here:
#   * filterwarnings - the suite emits a large number of datetime.utcnow()
#     DeprecationWarnings; they must stay warnings, never errors.
#   * addopts        - no --strict-markers (the guard in
#     backend/tests/conftest.py enforces the same contract mechanically, and
#     an addopts entry would change the effective command line of every
#     invocation).
#   * norecursedirs / python_files / python_classes / xfail_strict.
#
# What the selection-contract guard in backend/tests/conftest.py enforces, on
# a full-tree collection (it aborts the run with exit code 4):
#   * every marker carried by a collected test is a declared marker;
#   * the `acceptance` population is exactly the tests under
#     backend/tests/acceptance/;
#   * the `gui` population is exactly the tests of the modules registered in
#     LIVE_GUI_MODULES (backend/tests/conftest.py), in both directions;
#   * the `network` population is exactly the `provider_e2e` population;
#   * the configuration in use is this file, and it declares all ten
#     canonical markers.
# The guard does NOT check the other markers' populations - the descriptions
# of `slow`, `flaky`, `integration`, `process_kill`, `provider_e2e`,
# `concurrency` and `gated_soak` are maintained by hand, so a change to the
# code behind them has to be reflected here.

[pytest]
testpaths = backend/tests
asyncio_mode = strict
markers =
    slow: a slow test (deselect with '-m "not slow"')
    flaky: declared for future use; not currently applied to any test
    integration: declared for future use; not currently applied to any test
    acceptance: the acceptance sub-suite under backend/tests/acceptance/
    gui: requires a live interactive Windows desktop and the real UI Automation stack (the modules registered in LIVE_GUI_MODULES in backend/tests/conftest.py; currently backend/tests/acceptance/test_gui_fixture.py)
    network: requires an outbound network connection (currently every provider_e2e test)
    process_kill: real Windows process-kill integration tests (run explicitly with SYTHION_RUN_PROCESS_KILL=1)
    provider_e2e: real provider-backed specialist E2E tests (run explicitly with SYTHION_RUN_PROVIDER_E2E=1 plus a configured provider credential/model; skipped otherwise)
    concurrency: applied at module level to backend/tests/test_phase105_concurrency.py and backend/tests/test_phase1075_hardening.py (53 tests in total, not all of them concurrency tests)
    gated_soak: the synthetic learning-soak workload in backend/tests/test_phase115_soak.py (one test); despite the name it is NOT gated by an environment flag and runs in the default suite
