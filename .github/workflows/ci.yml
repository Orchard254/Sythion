name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Guard (test tooling install is pinned)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $bad = Get-Content .github/workflows/ci.yml | Where-Object { $_.Trim() -cmatch '^(pip install|python -m pip install)' -and $_ -cmatch 'pytest' -and $_ -cnotmatch '==' }
          if ($bad) { Write-Error ("unpinned pytest install: " + ($bad -join ' | ')); exit 1 }

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        # Provider-backed E2E (provider_e2e marker) is SKIPPED here: normal
        # CI never incurs provider cost and never needs credentials.
        run: python -m pytest tests -q

      - name: Import gate (packaged entrypoint compiles)
        # Must run from the repository root: backend/api/routes.py imports
        # backend.* absolutely, so the repo root must be on sys.path.
        working-directory: ${{ github.workspace }}
        run: python -c "import backend.main; import backend.api.routes"

  provider-e2e:
    name: Provider-backed specialist E2E (gated)
    runs-on: windows-latest
    # NEVER on push/PR: requires an explicit, credentialed dispatch so the
    # real provider is only exercised intentionally.
    if: github.event_name == 'workflow_dispatch' &&
        vars.RUN_PROVIDER_E2E == '1'
    environment: provider-e2e
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run provider-backed specialist E2E
        env:
          SYTHION_RUN_PROVIDER_E2E: "1"
          # Secrets are injected at runtime only; never written to the repo.
          SYTHION_OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          SYTHION_SELECTED_MODEL: ${{ vars.SYTHION_SELECTED_MODEL }}
        run: python -m pytest tests/test_phase975_provider_e2e.py -q -m provider_e2e

  frontend:
    name: Frontend build + lint
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (vitest)
        run: npm test

  tauri-build:
    name: Tauri shell build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the desktop shell (compile only, no bundle)
        run: npx --prefix frontend tauri build --no-bundle

      - name: Assert the shell binary was produced
        run: Test-Path "src-tauri/target/release/sythion.exe"
